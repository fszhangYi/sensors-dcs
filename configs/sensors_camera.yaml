# hik-sensors bundle — single RealSense（middle，与 plus 工位对齐）
version: 1
site: dcs-camera-only
dry_run: true

defaults:
  realsense:
    width: 640
    height: 480
    fps: 30
    exposure: 200
    gain: 64
    enable_depth: true
    align_to_color: true
    timeout_ms: 5000

devices:
  - id: rs-main
    kind: realsense
    name: "RealSense · Main"
    params:
      role: middle
      serial: "336222075436"
