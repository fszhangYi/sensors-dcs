# Minimal hik-sensors bundle — gello only (for sensors-dcs MVP)
version: 1
site: dcs-gello-mvp
dry_run: true

defaults:
  gello:
    baudrate: 57600
    max_delta_rad: 0.8
    joint_ids: [1, 2, 3, 4, 5, 6, 7]

devices:
  - id: gello-leader
    kind: gello
    name: "Gello · Leader"
    endpoint: "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTAA088F-if00-port0"
    params:
      port_substr: "FTAA088F"
      gripper_config: null
