# Minimal hik-sensors bundle — gello only (for sensors-dcs MVP)
# 串口 / 仿射与 sensors_full_cell_plus.yaml 对齐
version: 1
site: dcs-gello-mvp
# Windows 真机：改 false；无硬件演示：true
dry_run: true

defaults:
  gello:
    baudrate: 57600
    max_delta_rad: 0.8
    joint_ids: [1, 2, 3, 4, 5, 6, 7]
    # Affine q=(q_raw-offsets)*signs — see docs/gello-joint-affine.md
    joint_offsets:
      - 1.5707963267948966
      - 6.283185307179586
      - 6.283185307179586
      - 6.283185307179586
      - 4.71238898038469
      - 3.141592653589793
      - 1.78
    joint_signs: [1, 1, -1, 1, 1, 1, -1]

devices:
  - id: gello-leader
    kind: gello
    name: "Gello · Leader"
    endpoint: "COM10"
    params:
      port_substr: ""
      gripper_config: null
      joint_offsets:
        - 1.5707963267948966
        - 6.283185307179586
        - 6.283185307179586
        - 6.283185307179586
        - 4.71238898038469
        - 3.141592653589793
        - 1.78
      joint_signs: [1, 1, -1, 1, 1, 1, -1]
