# sensors-dcs — Cell C / G26562 从站 · 右 D435（cam-g26562-right）
# 设备清单：./sensors_g26562.yaml
# 本机 = slave-right；双击 g26562.bat 启动
version: 1
site: dcs-g26562-slave-right

station:
  role: slave
  id: cell-c-g26562-right
  advertise_ip: 192.168.1.33  # 本从站可路由局域网 IP
  peer_port: 7010
  master_ip: 192.168.1.77     # = 主站 station.advertise_ip
  master_port: 7010

sensors_config: ./sensors_g26562.yaml
dry_run: false

runtime:
  control_host: "0.0.0.0"
  control_port: 7010
  viz_host: "0.0.0.0"
  viz_port: 7011
  viz_hz: 5
  console_hz: 5

record:
  save_dir: C:\Users\user\Desktop\autodl-tmp\_dcs_data_slave_right
  episode_index: 0

# 仅右路 D435；无 gello / 臂 / 夹爪
agents:
  - id: cam-g26562-right
    type: realsense
    sensor_id: rs-g26562-right
    hz: 90
    buffer_frames: 2
