# sensors-dcs — Elite arm READ-ONLY only (no gello / camera / gripper)
#
# Usage:
#   sensors-dcs run -c configs/robot_only.yaml
#   python -m sensors_dcs.desktop_main -c configs/robot_only.yaml --ui
#
# Safety: agent type=arm → sensor kind=arm_read → Elite EC monitor only.
version: 1
site: dcs-robot-read

sensors_config: ./sensors_robot.yaml
# true = 合成关节角；false = 读真实 Elite monitor
dry_run: true

runtime:
  control_host: "0.0.0.0"
  control_port: 7010
  viz_host: "0.0.0.0"
  viz_port: 7011
  viz_hz: 15
  console_hz: 5

record:
  save_dir: D:\data_new
  episode_index: 0

agents:
  - id: arm
    type: arm
    sensor_id: arm-elite
    hz: 50
    buffer_frames: 64
