# hik-sensors bundle — gello + DH/慧灵 gripper + multi RealSense + Elite EC/CS66
# 默认启动设备清单（与 configs/default.yaml 配对）
version: 1
site: dcs-full-cell
# Windows 真机：改 false；无硬件演示：true
dry_run: true

defaults:
  gello:
    baudrate: 57600
    max_delta_rad: 0.8
    joint_ids: [1, 2, 3, 4, 5, 6, 7]
    # Affine q=(q_raw-offsets)*signs — aligned with gello host (J7 → 慧灵 mm)
    # J7: raw 1.83→0 mm, raw 0.9986→65 mm
    joint_offsets:
      - 1.5707963267948966
      - 6.283185307179586
      - 6.283185307179586
      - 6.283185307179586
      - -4.71238898038469
      - 3.141592653589793
      - 1.83
    joint_signs: [1, 1, -1, 1, 1, 1, -78.18138080346404]
  arm_write:
    num_joints: 6
    robot_tcp_port: 54321
    monitor_wait_s: 10
    max_delta_deg: 15.0
    enforce_soft_limits: true
    tt_t: 2
    tt_response_enable: 0
  arm_cs_write:
    num_joints: 6
    max_delta_deg: 2.0
    primary_port: 30001
    headless_mode: true
    require_rtsi: true
    stream_max_rad_s: 1.0
    servoj_time: 0.01
    servoj_lookahead_time: 0.25
    servoj_gain: 300
    servoj_timeout_ms: 2000
  gripper:
    baudrate: 115200
    slave_id: 1
    default_force: 100
    default_speed: 100
    init_on_open: false
  gripper_huiling:
    baudrate: 115200
    slave_id: 1
    timeout_ms: 300
    default_speed_mm_s: 50
    default_current_a: 0.3
    init_on_open: false
    position_min_mm: 0.0
    position_max_mm: 65.0
  realsense:
    width: 640
    height: 480
    fps: 30
    exposure: 200
    gain: 64
    enable_depth: true
    align_to_color: true
    timeout_ms: 5000

devices:
  - id: gello-leader
    kind: gello
    name: "Gello · Leader"
    endpoint: "COM10"
    params:
      port_substr: ""
      gripper_config: null
      joint_offsets:
        - 1.5707963267948966
        - 6.283185307179586
        - 6.283185307179586
        - 6.283185307179586
        - -4.71238898038469
        - 3.141592653589793
        - 1.83
      joint_signs: [1, 1, -1, 1, 1, 1, -78.18138080346404]

  - id: gripper-dh
    kind: gripper
    name: "DH AG95 夹爪"
    # Windows：改成实际夹爪串口（勿与 Gello / 慧灵 同口）
    endpoint: "COM13"
    params:
      port_substr: ""
      read_scale: [1.0]
      read_offset: [0.0]
      write_scale: [1.0]
      write_offset: [0.0]

  - id: gripper-huiling
    kind: gripper_huiling
    name: "慧灵 Z-EFG-C65"
    endpoint: "COM4"
    params:
      baudrate: 115200
      slave_id: 1
      default_speed_mm_s: 50
      default_current_a: 0.3
      init_on_open: false

  - id: rs-left
    kind: realsense
    name: "RealSense · Left"
    params:
      role: left
      serial: "218722271098"

  - id: rs-right
    kind: realsense
    name: "RealSense · Right"
    params:
      role: right
      serial: "327122077544"

  - id: rs-middle
    kind: realsense
    name: "RealSense · Middle"
    params:
      role: middle
      serial: "336222075436"

  # Cell C / G26562 cameras
  - id: rs-g26562-wrist
    kind: realsense
    name: "RealSense · G26562 Wrist (D405)"
    params:
      role: g26562_wrist
      serial: "218622279681"

  - id: rs-g26562-right
    kind: realsense
    name: "RealSense · G26562 Right (D435)"
    params:
      role: g26562_right
      serial: "337122074288"

  # Third name typed twice as right in request → treated as left D435
  - id: rs-g26562-left
    kind: realsense
    name: "RealSense · G26562 Left (D435)"
    params:
      role: g26562_left
      serial: "334622072861"

  - id: arm-elite
    kind: arm_write
    name: "Elite · Arm (write gated)"
    endpoint: "10.111.34.200"
    params:
      robot_ip: "10.111.34.200"
      num_joints: 6
      max_delta_deg: 15.0
      enforce_soft_limits: true

  # Cell C — Elite CS66 unit G26562 (ExternalControl + RTSI + cs66_kin_g26562)
  - id: arm-cs66
    kind: arm_cs_write
    name: "Elite CS66 · C (G26562)"
    endpoint: "192.168.1.200"
    params:
      robot_ip: "192.168.1.200"
      num_joints: 6
      max_delta_deg: 2.0
      primary_port: 30001
      headless_mode: true
      require_rtsi: true
      stream_max_rad_s: 1.0
      servoj_time: 0.01
      servoj_lookahead_time: 0.25
      servoj_gain: 300
      kinematics: cs66_kin_g26562
      kinematics_profile: elite_cs66
      # local_ip: "192.168.1.xxx"
      rtsi_output_recipe: rtsi/output_recipe.txt
      rtsi_input_recipe: rtsi/input_recipe.txt
