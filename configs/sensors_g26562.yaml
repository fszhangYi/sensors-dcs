# hik-sensors bundle — Cell C / G26562 从站 · 右 D435
# 配对：./g26562.yaml（本机 slave-right）
version: 1
site: dcs-g26562-slave-right
dry_run: false

defaults:
  realsense:
    width: 640
    height: 480
    fps: 90
    exposure: 200
    gain: 64
    enable_depth: false
    align_to_color: false
    timeout_ms: 5000

devices:
  - id: rs-g26562-right
    kind: realsense
    name: "RealSense · G26562 Right (D435)"
    params:
      role: g26562_right
      serial: "337122074288"
