# hik-sensors bundle — multi RealSense（三路，与 sensors_full_cell_plus 对齐；无 wrist）
version: 1
site: dcs-camera-multi
dry_run: true

defaults:
  realsense:
    width: 640
    height: 480
    fps: 30
    exposure: 200
    gain: 64
    enable_depth: true
    align_to_color: true
    timeout_ms: 5000

devices:
  - id: rs-left
    kind: realsense
    name: "RealSense · Left"
    params:
      role: left
      serial: "218722271098"

  - id: rs-right
    kind: realsense
    name: "RealSense · Right"
    params:
      role: right
      serial: "327122077544"

  - id: rs-middle
    kind: realsense
    name: "RealSense · Middle"
    params:
      role: middle
      serial: "336222075436"
