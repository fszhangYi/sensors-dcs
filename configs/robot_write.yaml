# sensors-dcs — Elite arm READ + WRITE (must pair). See docs/arm-write.md
#
# Usage:
#   sensors-dcs run -c configs/robot_write.yaml
#   sensors-dcs run -c configs/robot_write.yaml --no-dry-run
#
# Safety: share one arm_write sensor; read agent fills live joints; writer only
# jogs relative to that pose after Arm.
version: 1
site: dcs-robot-write

sensors_config: ./sensors_robot_write.yaml
dry_run: true

runtime:
  control_host: "0.0.0.0"
  control_port: 7010
  viz_host: "0.0.0.0"
  viz_port: 7011
  viz_hz: 15
  console_hz: 5

record:
  save_dir: ./data
  episode_index: 0
  queue_maxsize: 512

agents:
  - id: arm
    type: arm
    sensor_id: arm-elite
    hz: 50
    buffer_frames: 64
  - id: arm-write
    type: arm_write
    sensor_id: arm-elite
    hz: 5
    buffer_frames: 8
