# hik-sensors bundle — gello + DH gripper + multi RealSense
version: 1
site: dcs-full-cell
# Windows 真机：改 false；无硬件演示：true
dry_run: true

defaults:
  gello:
    baudrate: 57600
    max_delta_rad: 0.8
    joint_ids: [1, 2, 3, 4, 5, 6, 7]
  gripper:
    baudrate: 115200
    slave_id: 1
    default_force: 100
    default_speed: 100
    init_on_open: false
  realsense:
    width: 1280
    height: 720
    fps: 15
    exposure: 200
    gain: 64
    enable_depth: true
    align_to_color: true
    timeout_ms: 5000

devices:
  - id: gello-leader
    kind: gello
    name: "Gello · Leader"
    # Windows 示例：COM3
    endpoint: "COM3"
    params:
      port_substr: ""
      gripper_config: null

  - id: gripper-dh
    kind: gripper
    name: "DH AG95 夹爪"
    # Windows：改成实际夹爪串口，如 COM4（勿与 Gello 同口）
    endpoint: "COM4"
    params:
      port_substr: ""
      read_scale: [1.0]
      read_offset: [0.0]
      write_scale: [1.0]
      write_offset: [0.0]

  - id: rs-left
    kind: realsense
    name: "RealSense · Left"
    params:
      role: left
      # Replace before --no-dry-run
      serial: "TODO_LEFT_SERIAL"

  - id: rs-right
    kind: realsense
    name: "RealSense · Right"
    params:
      role: right
      # Replace before --no-dry-run
      serial: "TODO_RIGHT_SERIAL"

  - id: rs-middle
    kind: realsense
    name: "RealSense · Middle"
    params:
      role: middle
      # Hardcoded for this cell
      serial: "336222075436"
