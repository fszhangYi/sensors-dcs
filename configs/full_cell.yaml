# sensors-dcs — gello + gripper + multi RealSense + Elite arm
# 结构与 full_cell_plus.yaml 对齐（演示默认 dry_run: true）
version: 1
site: dcs-full-cell

sensors_config: ./sensors_full_cell.yaml
# true = 合成假数据；false = 真机（串口 + RealSense serial）
dry_run: true

runtime:
  control_host: "0.0.0.0"
  control_port: 7010
  viz_host: "0.0.0.0"
  viz_port: 7011
  # 含多路 JPEG，推送略降
  viz_hz: 5
  console_hz: 5

gello_arm_sync:
  align_max_rad: 0.8
  ramp_duration_s: 20
  ramp_hz: 5
  sync_done_eps_rad: 0.03
  max_ramp_rounds: 3

# Gello → gripper write（UI 开关）。DH AG95 position_norm ~0..0.637。
gripper_gello_sync:
  clamp_min: 0.0
  clamp_max: 0.637
  command_as: position_norm

record:
  save_dir: D:\data_new
  episode_index: 0

agents:
  - id: gello
    type: gello
    sensor_id: gello-leader
    hz: 50
    buffer_frames: 64
  - id: gripper-read
    type: gripper_read
    sensor_id: gripper-dh
    hz: 50
    buffer_frames: 64
  - id: gripper-write
    type: gripper_write
    sensor_id: gripper-dh
    hz: 5
    buffer_frames: 8
  - id: cam-left
    type: realsense
    sensor_id: rs-left
    hz: 60
    buffer_frames: 2
  - id: cam-right
    type: realsense
    sensor_id: rs-right
    hz: 60
    buffer_frames: 2
  - id: cam-middle
    type: realsense
    sensor_id: rs-middle
    hz: 60
    buffer_frames: 2
  - id: arm
    type: arm
    sensor_id: arm-elite
    hz: 50
    buffer_frames: 64
  - id: arm-write
    type: arm_write
    sensor_id: arm-elite
    hz: 5
    buffer_frames: 8
