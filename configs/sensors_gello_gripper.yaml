# hik-sensors bundle — gello + DH gripper
# 串口 / 仿射与 sensors_full_cell_plus.yaml 对齐
version: 1
site: dcs-gello-gripper
# Windows 真机：改 false；无硬件演示：true
dry_run: true

defaults:
  gello:
    baudrate: 57600
    max_delta_rad: 0.8
    joint_ids: [1, 2, 3, 4, 5, 6, 7]
    joint_offsets:
      - 1.5707963267948966
      - 6.283185307179586
      - 6.283185307179586
      - 6.283185307179586
      - 4.71238898038469
      - 3.141592653589793
      - 1.78
    joint_signs: [1, 1, -1, 1, 1, 1, -1]
  gripper:
    baudrate: 115200
    slave_id: 1
    default_force: 100
    default_speed: 100
    init_on_open: false

devices:
  - id: gello-leader
    kind: gello
    name: "Gello · Leader"
    endpoint: "COM10"
    params:
      port_substr: ""
      gripper_config: null
      joint_offsets:
        - 1.5707963267948966
        - 6.283185307179586
        - 6.283185307179586
        - 6.283185307179586
        - 4.71238898038469
        - 3.141592653589793
        - 1.78
      joint_signs: [1, 1, -1, 1, 1, 1, -1]

  - id: gripper-dh
    kind: gripper
    name: "DH AG95 夹爪"
    endpoint: "COM13"
    params:
      port_substr: ""
      read_scale: [1.0]
      read_offset: [0.0]
      write_scale: [1.0]
      write_offset: [0.0]
