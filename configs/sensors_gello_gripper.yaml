# hik-sensors bundle — gello + DH gripper (read agent uses gripper device)
version: 1
site: dcs-gello-gripper
# Windows 真机：改 false；无硬件演示：true
dry_run: true

defaults:
  gello:
    baudrate: 57600
    max_delta_rad: 0.8
    joint_ids: [1, 2, 3, 4, 5, 6, 7]
    # Affine q=(q_raw-offsets)*signs — see docs/gello-joint-affine.md
    joint_offsets:
      - 1.5707963267948966
      - 6.283185307179586
      - 6.283185307179586
      - 6.283185307179586
      - 4.71238898038469
      - 3.141592653589793
      - 1.78
    joint_signs: [1, 1, -1, 1, 1, 1, -1]
  gripper:
    baudrate: 115200
    slave_id: 1
    default_force: 100
    default_speed: 100
    init_on_open: false
    # false: hardware feedback; true: last commanded position (see docs/gripper-fake-read.md)
    fake: false

devices:
  - id: gello-leader
    kind: gello
    name: "Gello · Leader"
    # Windows 示例：COM3
    endpoint: "COM3"
    params:
      port_substr: ""
      gripper_config: null
      joint_offsets:
        - 1.5707963267948966
        - 6.283185307179586
        - 6.283185307179586
        - 6.283185307179586
        - 4.71238898038469
        - 3.141592653589793
        - 1.78
      joint_signs: [1, 1, -1, 1, 1, 1, -1]

  - id: gripper-dh
    kind: gripper
    name: "DH AG95 夹爪"
    # Windows：改成实际夹爪串口，如 COM4（勿与 Gello 同口）
    endpoint: "COM4"
    params:
      port_substr: ""
      read_scale: [1.0]
      read_offset: [0.0]
      write_scale: [1.0]
      write_offset: [0.0]
      # Unreliable AG95 feedback → set true
      fake: false
