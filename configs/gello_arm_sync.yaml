# sensors-dcs — Gello → Arm one-shot alignment sync + teleop（摇操）
# See docs/gello-arm-sync.md and docs/gello-arm-teleop.md
#
#   sensors-dcs run -c configs/gello_arm_sync.yaml
#   sensors-dcs run -c configs/gello_arm_sync.yaml --no-dry-run
#
# Flow: robot·Read live → Arm →「同步」→「摇操」→ 解除摇操
version: 1
site: dcs-gello-arm-sync

sensors_config: ./sensors_gello_arm_sync.yaml
dry_run: true

runtime:
  control_host: "0.0.0.0"
  control_port: 7010
  viz_host: "0.0.0.0"
  viz_port: 7011
  viz_hz: 15
  console_hz: 5

gello_arm_sync:
  align_max_rad: 0.8
  ramp_duration_s: 20
  ramp_hz: 5
  sync_done_eps_rad: 0.03
  max_ramp_rounds: 3

gello_arm_teleop:
  teleop_hz: 50
  teleop_enter_max_rad: 0.05
  teleop_step_max_rad: 0.05
  teleop_jump_abort_rad: 0.35
  teleop_stale_max_ticks: 3
  teleop_write_fail_max: 5

record:
  save_dir: D:\data_new
  episode_index: 0

agents:
  - id: gello
    type: gello
    sensor_id: gello-leader
    hz: 50
    buffer_frames: 64
  - id: arm
    type: arm
    sensor_id: arm-elite
    hz: 50
    buffer_frames: 64
  - id: arm-write
    type: arm_write
    sensor_id: arm-elite
    hz: 5
    buffer_frames: 8
