# sensors-dcs — Gello → Arm one-shot alignment sync
# See docs/gello-arm-sync.md
#
#   sensors-dcs run -c configs/gello_arm_sync.yaml
#   sensors-dcs run -c configs/gello_arm_sync.yaml --no-dry-run
#
# Flow: robot·Read live → Arm →「同步」(20s @ 5Hz to frozen gello pose) → done
# After sync completes, gello does NOT command the arm.
version: 1
site: dcs-gello-arm-sync

sensors_config: ./sensors_gello_arm_sync.yaml
dry_run: true

runtime:
  control_host: "0.0.0.0"
  control_port: 7010
  viz_host: "0.0.0.0"
  viz_port: 7011
  viz_hz: 15
  console_hz: 5

gello_arm_sync:
  align_max_rad: 0.8
  ramp_duration_s: 20
  ramp_hz: 5
  sync_done_eps_rad: 0.03
  max_ramp_rounds: 3

record:
  save_dir: ./data
  episode_index: 0
  queue_maxsize: 512

agents:
  - id: gello
    type: gello
    sensor_id: gello-leader
    hz: 100
    buffer_frames: 64
  - id: arm
    type: arm
    sensor_id: arm-elite
    hz: 50
    buffer_frames: 64
  - id: arm-write
    type: arm_write
    sensor_id: arm-elite
    hz: 5
    buffer_frames: 8
