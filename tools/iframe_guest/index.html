<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iframe host probe · 6008</title>
  <style>
    :root {
      --bg: #0b1018;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3dd6c6;
      --border: rgba(58, 77, 102, 0.75);
      --panel: rgba(18, 26, 38, 0.92);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .bar h1 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 650;
      white-space: nowrap;
    }
    .muted { color: var(--muted); font-size: 0.78rem; }
    label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    input[type="url"], select {
      background: #0f1622;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.78rem;
    }
    input[type="url"] { min-width: min(42rem, 55vw); flex: 1 1 18rem; }
    button {
      background: #152033;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    #status { font-size: 0.75rem; color: var(--muted); }
    #status.ok { color: #86efac; }
    #status.fail { color: #fca5a5; }
    .frame-wrap {
      position: relative;
      min-height: 0;
      background: #000;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="bar">
    <h1>iframe host · 6008</h1>
    <span class="muted">embeds sensors-dcs as guest</span>
    <label>
      URL
      <input type="url" id="urlInput" spellcheck="false" />
    </label>
    <button type="button" id="btnLoad">Load</button>
    <label>
      locale
      <select id="localeSel">
        <option value="zh">zh</option>
        <option value="en">en</option>
      </select>
    </label>
    <label>
      theme
      <select id="themeSel">
        <option value="dark">dark</option>
        <option value="light">light</option>
        <option value="system">system</option>
      </select>
    </label>
    <button type="button" id="btnPush">Push prefs</button>
    <span id="status">idle</span>
  </div>
  <div class="frame-wrap">
    <iframe id="guest" title="sensors-dcs guest" allow="fullscreen"></iframe>
  </div>
  <script>
    const HOST_SOURCE = 'sensors-view-host';
    const GUEST_SOURCE = 'sensors-view';
    const DEFAULT_URL = 'https://u658526-m86b-7fdc269f.weste.seetacloud.com:8443/login?from=/';
    const STORAGE_KEY = 'sensors-dcs.iframe-host.url';

    const urlInput = document.getElementById('urlInput');
    const localeSel = document.getElementById('localeSel');
    const themeSel = document.getElementById('themeSel');
    const frame = document.getElementById('guest');
    const statusEl = document.getElementById('status');

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || '';
    }

    function normalizeBase(raw) {
      const s = String(raw || '').trim();
      if (!s) return '';
      try {
        const u = new URL(s);
        return u.origin + (u.pathname.replace(/\/+$/, '') || '');
      } catch (e) {
        return s.replace(/\/+$/, '');
      }
    }

    function withPrefs(raw) {
      const u = new URL(raw, location.href);
      u.searchParams.set('locale', localeSel.value);
      u.searchParams.set('theme', themeSel.value);
      return u.toString();
    }

    function guestOrigin() {
      try { return new URL(frame.src).origin; }
      catch (e) { return '*'; }
    }

    function pushPrefs() {
      if (!frame.contentWindow) return;
      const payload = {
        source: HOST_SOURCE,
        version: 1,
        type: 'embed-prefs',
        locale: localeSel.value,
        theme: themeSel.value,
      };
      try {
        frame.contentWindow.postMessage(payload, guestOrigin());
        setStatus('prefs pushed', 'ok');
      } catch (e) {
        setStatus('prefs push failed', 'fail');
      }
    }

    function loadFrame() {
      const raw = urlInput.value.trim() || DEFAULT_URL;
      urlInput.value = raw;
      try { localStorage.setItem(STORAGE_KEY, raw); } catch (e) {}
      setStatus('loading…');
      frame.src = withPrefs(raw);
    }

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || data.source !== GUEST_SOURCE) return;
      let expected;
      try { expected = new URL(urlInput.value || DEFAULT_URL).origin; }
      catch (e) { expected = null; }
      if (expected && event.origin !== expected) return;
      if (data.type === 'embed-ready' || data.type === 'embed-request-prefs') {
        setStatus('guest ready · ' + data.type, 'ok');
        pushPrefs();
      }
    });

    document.getElementById('btnLoad').onclick = loadFrame;
    document.getElementById('btnPush').onclick = pushPrefs;
    localeSel.onchange = pushPrefs;
    themeSel.onchange = pushPrefs;
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadFrame();
    });

    try {
      urlInput.value = localStorage.getItem(STORAGE_KEY) || DEFAULT_URL;
    } catch (e) {
      urlInput.value = DEFAULT_URL;
    }
    loadFrame();
  </script>
</body>
</html>
